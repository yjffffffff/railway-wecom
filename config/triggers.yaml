# ==========================================
# 触发器配置 v2.0 - 冰雪/旅游/周期股
# ==========================================

# 数据源配置
data_source:
  use_tushare: true
  use_eastmoney: true
  use_akshare: true
  use_tencent: true
  # 日线数据源优先级（依次尝试，失败自动切换并熔断）
  # 云端 IP 常被东财 push2his 断连，故腾讯直连优先于东财
  daily_priority: [tushare, tencent, eastmoney, akshare]

# Tushare 配置（主数据源，需 token）
tushare:
  token: ""

# 企业微信推送配置
wecom:
  corp_id: ""
  agent_id: ""
  secret: ""
  webhook_url: ""
  push_template: "markdown"

# 运行时配置
runtime:
  log_level: "INFO"
  timezone: "Asia/Shanghai"

# 频控配置
frequency_control:
  # 同一股票冷却天数
  same_symbol_cooldown_days: 10
  # 同一板块日推送上限
  same_sector_daily_limit: 2
  # 宏观类日推送上限
  macro_daily_limit: 1
  # 仅交易时间推送
  trading_hours_only: true
  # 静默时段（24h制）
  quiet_hours:
    - "11:30-13:00"
    - "15:00-09:15"

# 推送规则开关与参数
push_rules:
  # L4 个股达标买点
  L4_stock_pick:
    enabled: true
    daily_limit: 3
  
  # L2 政策落地实锤
  L2_policy_landing:
    enabled: true
  
  # L5 龙头异动风向
  L5_leader_anomaly:
    enabled: true
    volume_spike_ratio: 3.0
    turnover_threshold: 0.30
  
  # L6 风控熔断预警
  L6_risk_circuit:
    enabled: true
    margin_drop_threshold: 5000000000  # 50亿

# 选股器参数
selector:
  min_score: 60
  volume_shrink_threshold: 0.5
  platform_days_min: 10
  platform_days_max: 60
  breakout_vol_ratio: 1.5
  retest_days: 5
  rs_period: 20

