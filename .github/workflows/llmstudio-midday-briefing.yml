name: LLMStudio Midday News Briefing

# 北京时间12:40（UTC 4:40）运行，13:00开盘前推送完毕
on:
  schedule:
    - cron: '40 4 * * 1-5'   # 周一至周五（交易日）
  workflow_dispatch:          # 支持手动触发测试

defaults:
  run:
    working-directory: llmstudio

jobs:
  briefing:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Generate midday briefing and push
        env:
          BRIEFING_TYPE: midday      # 午间快报模式
          NEWS_HOURS: '5'            # 覆盖早上7:40以来的新闻
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
          LLM_API_URL: ${{ secrets.LLM_API_URL }}
          LLM_MODEL: ${{ secrets.LLM_MODEL }}
          BARK_URL: ${{ secrets.BARK_URL }}
          SERVERCHAN_KEY: ${{ secrets.SERVERCHAN_KEY }}
          WECOM_WEBHOOK: ${{ secrets.WECOM_WEBHOOK_URL }}
          PUSH_ENABLED: 'true'
        run: python generate_briefing.py

      - name: Commit briefing archive
        continue-on-error: true
        working-directory: .
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add llmstudio/briefings/
          git diff --staged --quiet || git commit -m "midday briefing $(date -u +%F)"
          git push
