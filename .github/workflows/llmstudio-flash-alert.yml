name: LLMStudio Flash Alert (Overnight)

# 外围市场突发预警（已停用2026-09-23，用户要求暂停隔夜闪报）
on:
  # schedule:
  #   - cron: '*/30 13-20 * * *'
  workflow_dispatch:

defaults:
  run:
    working-directory: llmstudio

jobs:
  flash:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Check overnight markets and push if triggered
        env:
          BARK_URL: ${{ secrets.BARK_URL }}
          SERVERCHAN_KEY: '${{ secrets.SERVERCHAN_KEY }}'
          WECOM_WEBHOOK: ${{ secrets.WECOM_WEBHOOK_URL }}
          PUSH_ENABLED: 'true'
        run: python flash_alert.py

      - name: Commit dedup state
        continue-on-error: true
        working-directory: .
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add llmstudio/knowledge/flash_state.json
          git diff --staged --quiet || git commit -m "flash alert state update"
          git push
