name: Ice-Snow Cycle Stock Push

on:
  schedule:
    # UTC 07:30 = Beijing 15:30 (trading days Mon-Fri)
    - cron: '30 7 * * 1-5'
  workflow_dispatch:
    inputs:
      date:
        description: 'Target trade date (YYYY-MM-DD), default: last trading day'
        required: false
        type: string
      mode:
        description: 'Run mode'
        required: false
        default: 'scan'
        type: choice
        options: ['scan', 'test']

env:
  PYTHON_VERSION: '3.11'
  WECOM_WEBHOOK_URL: ${{ secrets.WECOM_WEBHOOK_URL }}
  AKSHARE_ENABLED: 'true'
  LOG_LEVEL: 'INFO'
  TIMEZONE: 'Asia/Shanghai'

jobs:
  push:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run push system
        env:
          WECOM_WEBHOOK_URL: ${{ secrets.WECOM_WEBHOOK_URL }}
        run: |
          if [ "${{ github.event.inputs.mode }}" = "test" ]; then
            python main.py --date "${{ github.event.inputs.date }}" --mode test
          else
            python main.py --date "${{ github.event.inputs.date }}" --mode scan
          fi

      - name: Upload logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: run-logs
          path: |
            *.log
            logs/
          retention-days: 7